title: "IML - Introduction to Machine Learning Lecture Notes"
description: "Lecture notes for Introduction to Machine Learning course"
author: "Dr. Anirban Sen"

remote_theme: just-the-docs/just-the-docs
url: "https://bitanM.github.io"
baseurl: "/IML"

search_enabled: true
heading_anchors: true

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .git
  - .gitignore